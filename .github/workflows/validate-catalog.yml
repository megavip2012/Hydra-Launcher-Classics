name: Validate catalog

on:
  push:
    branches: [main, vimmvault-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog JSON
        run: node scripts/validate-catalog.mjs
